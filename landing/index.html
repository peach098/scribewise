<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScribeWise</title>
<meta name="robots" content="noindex, follow">
<link rel="alternate" hreflang="ru" href="https://scribewise.dev/ru/">
<link rel="alternate" hreflang="en" href="https://scribewise.dev/en/">
<link rel="alternate" hreflang="x-default" href="https://scribewise.dev/en/">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<script>
  (function () {
    var lang = null;
    try { lang = localStorage.getItem("scribewise-lang"); } catch (e) {}
    if (lang !== "ru" && lang !== "en") {
      var langs = navigator.languages || [navigator.language || ""];
      lang = langs.some(function (l) { return /^(ru|be|uk|kk)\b/i.test(l); }) ? "ru" : "en";
    }
    location.replace("/" + lang + "/");
  })();
</script>

</head>

</body>
</html>
