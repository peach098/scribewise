[project]
name = "scribe"
version = "0.5.0"
description = "AI agent that drafts replies to your work messages in your style and context"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "telethon>=1.36",
    "aiogram>=3",
    "anthropic>=2.3.0",
    "openai>=3.41.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.29",
    "alembic>=1.20.1",
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6",
    "cryptography>=43",
    "structlog>=24",
    "aiohttp>=3.9",
    "segno>=1.6.6",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.21",
    "testcontainers[postgres]>=4.15.0",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "types-pyyaml>=6.0.12.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scribe"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".claude/worktrees"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["scribe"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["scribe"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["scribe", "scribe.*"]
strict = true

# Telethon ships no type hints; keep strict mode everywhere else.
[[tool.mypy.overrides]]
module = ["telethon", "telethon.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
