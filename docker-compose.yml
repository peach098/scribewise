services:
  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SCRIBE_HEALTH_HOST_PORT:-8080}:8080"
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scribe
      POSTGRES_PASSWORD: scribe
      POSTGRES_DB: scribe
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${SCRIBE_DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scribe -d scribe"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
